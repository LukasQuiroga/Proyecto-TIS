services:
  postgres:
    image: postgres:15.10
    container_name: exampass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exampass}
      POSTGRES_USER: ${POSTGRES_USER:-exampass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exampass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-exampass} -d ${POSTGRES_DB:-exampass}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: