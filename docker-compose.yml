services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exampass-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      SERVER_PORT: 8080
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      QR_ENCRYPTION_KEY: ${QR_ENCRYPTION_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-fotos-perfil}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
    networks:
      - coolify
      - default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exampass-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - coolify
      - default

networks:
  coolify:
    external: true
