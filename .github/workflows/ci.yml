name: CI - ExamPass

on:
  push:
  pull_request:
    branches:
      - develop

jobs:

  backend:
    name: Backend - Spring Boot
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15.10

        env:
          POSTGRES_DB: exampass
          POSTGRES_USER: exampass
          POSTGRES_PASSWORD: exampass

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U exampass -d exampass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: exampass
      DB_USER: exampass
      DB_PASSWORD: exampass

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permisos a Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar backend y ejecutar pruebas
        run: ./mvnw -B clean verify


  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar ESLint
        run: pnpm exec eslint .

      - name: Compilar frontend
        run: pnpm build