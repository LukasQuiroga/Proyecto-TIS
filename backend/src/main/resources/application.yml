server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: exampass

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:exampass}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER:exampass}
    password: ${DB_PASSWORD:exampass}

  jpa:
    properties:
      hibernate:
        default_schema: seguridad
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration


app:
  security:
    admin-password: exampass


brevo:
  api-key: ${BREVO_API_KEY}

  remitente:
    email: abadon200324@gmail.com
    nombre: ExamPass

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 21600000